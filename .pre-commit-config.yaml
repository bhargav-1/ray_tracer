# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
fail_fast: false
exclude: |
  (?x)(
      ^.idea/|
      ^.git/
  )
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key

      - id: end-of-file-fixer
      #     - id: forbid-new-submodules
      - id: no-commit-to-branch
        args: [ --branch, master, --branch, devel ]
      - id: trailing-whitespace
        args: [ --markdown-linebreak-ext=md ]
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shellcheck
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.12.0
    hooks:
      - id: hadolint
        args: [ --ignore, DL3008, --ignore, SC1091 ]
  - repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/pylint
    rev: v3.0.3
    hooks:
      - id: pylint
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format-18
        language: system
        types_or: [c, c++]
        args: [ -i, -style=file ]
      - id: clang-tidy
        name: clang-tidy
        entry: run-clang-tidy-18
        language: system
        # The runner parallelizes analysis itself using the available CPU cores.
        require_serial: true
        types_or: [c, c++]
        # Analyze translation units using their compiler flags; included headers are checked too.
        files: \.(c|cc|cpp|cxx)$
        # Match the legacy example sources marked SKIP_LINTING in src/app/CMakeLists.txt.
        exclude: '^src/app/src/(imgui_demo|chapter_(05|06|07|08|09|10)_[^/]+)\.cpp$'
        args: [ -p=build, -clang-tidy-binary=clang-tidy-18, -quiet ]
