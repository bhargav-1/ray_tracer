# BVH stress scene: 125 radius-1 spheres in a 10 x 10 x 10 volume.
# Centres are spaced 2 units apart, so neighbouring spheres touch.
# For volume overlap, reduce the spacing below 2 while keeping scale [1, 1, 1].
version: 1
camera:
  from: [-16, 15, -19]
  to: [0, 5, 0]
  up: [0, 1, 0]
  fov_deg: 45
  resolution: [800, 600]
lights:
  - position: [-15, 20, -20]
    color: [1, 1, 1]
objects:
  - name: Floor
    type: plane
    visible: true
    cast_shadow: true
    transform: {translate: [0, 0, 0], rotate_deg: [0, 0, 0], scale: [1, 1, 1]}
    material: {color: [0.18, 0.18, 0.2], ambient: 0.1, diffuse: 0.9, specular: 0, shininess: 200, reflective: 0, transparency: 0, refractive_index: 1}
  - name: Sphere 1-1-1
    type: sphere
    visible: true
    cast_shadow: true
    transform: {translate: [-4, 1, -4], rotate_deg: [0, 0, 0], scale: [1, 1, 1]}
    material: {color: [0.16, 0.45, 0.85], ambient: 0.1, diffuse: 0.7, specular: 0.3, shininess: 200, reflective: 0, transparency: 0, refractive_index: 1}
  - name: Sphere 2-1-1
