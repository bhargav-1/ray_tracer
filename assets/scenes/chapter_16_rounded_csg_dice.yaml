# Chapter 16: rounded CSG dice with recessed white pips.
# Body = union of 3 face boxes, 12 edge cylinders, and 8 corner spheres.
# Radius 0.16; centers +/-0.84; outer faces +/-1.
# Die = difference(body, union of 21 pip spheres).
# Select each rounded-body CSG to change color without recoloring pips.
version: 1
camera:
  from: [6, 4.7, -9]
  to: [0, 1.65, 0]
  up: [0, 1, 0]
  fov_deg: 43
  resolution: [900, 600]
lights:
  - visible: true
    position: [-3, 7, -6]
    color: [1, 1, 1]
  - visible: true
    position: [5, 5, -2]
    color: [0.2, 0.2, 0.2]
objects:
  - name: Blue die
    type: csg
    operation: difference
    transform:
      translate: [-1.2, 1, -0.5]
      rotate_deg: [0, -10, 0]
      scale: [1, 1, 1]
    children:
      - name: Blue die rounded body
        type: csg
        operation: union
        transform: {translate: [0, 0, 0], rotate_deg: [0, 0, 0], scale: [1, 1, 1]}
        material: {color: [0.3, 0.24, 0.7], ambient: 0.1, diffuse: 0.72, specular: 0.45, shininess: 100, reflective: 0.025, transparency: 0, refractive_index: 1}
        children: &rounded_parts
          - name: Rounded body L
            type: csg
            operation: union
            transform: {translate: [0, 0, 0], rotate_deg: [0, 0, 0], scale: [1, 1, 1]}
            children:
              - name: Rounded body L L
                type: csg
                operation: union
                transform: {translate: [0, 0, 0], rotate_deg: [0, 0, 0], scale: [1, 1, 1]}
                children:
                  - name: Rounded body L L L
                    type: csg
                    operation: union
                    transform: {translate: [0, 0, 0], rotate_deg: [0, 0, 0], scale: [1, 1, 1]}
                    children:
                      - name: Face box X
                        type: cube
                        cast_shadow: true
                        transform: {translate: [0, 0, 0], rotate_deg: [0, 0, 0], scale: [1, 0.84, 0.84]}
                        material: {color: [1, 1, 1], ambient: 0.1, diffuse: 0.9, specular: 0.9, shininess: 200, reflective: 0, transparency: 0, refractive_index: 1}
                      - name: Face box Y
