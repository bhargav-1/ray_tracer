# Jamis Buck's "Bounding boxes and hierarchies" bonus banner scene.
# http://www.raytracerchallenge.com/bonus/bounding-boxes.html
# Converted to the scene editor schema; angles below are in degrees.
# OBJ groups are subdivided by the editor's existing BVH compilation.
# The visible cubes illustrate the supplied bounds; they are not BVH nodes.
version: 1
camera:
  from: [0, 2.5, -10]
  to: [0, 1, 0]
  up: [0, 1, 0]
  fov_deg: 68.7549354
  resolution: [500, 200]
lights:
  - {visible: true, position: [-10, 100, -100], color: [1, 1, 1]}
  - {visible: true, position: [0, 100, 0], color: [0.1, 0.1, 0.1]}
  - {visible: true, position: [100, 10, -25], color: [0.2, 0.2, 0.2]}
  - {visible: true, position: [-100, 10, -25], color: [0.2, 0.2, 0.2]}
objects:
  - name: Center red dragon display
    type: group
    transform: {translate: [0, 2, 0], rotate_deg: [0, 0, 0], scale: [1, 1, 1]}
    children:
      - &pedestal
        name: Pedestal
        type: cylinder
        bounds: {minimum: -0.15, maximum: 0, closed: true}
        cast_shadow: true
        transform: &identity {translate: [0, 0, 0], rotate_deg: [0, 0, 0], scale: [1, 1, 1]}
        material: {color: [0.2, 0.2, 0.2], ambient: 0, diffuse: 0.8, specular: 0, shininess: 200, reflective: 0.2, transparency: 0, refractive_index: 1}
      - name: Dragon and bounds
        type: group
        transform: *identity
        children:
          - name: Red dragon
            type: obj
            source: ../models/dragon.obj
            cast_shadow: true
            # Original translation, then scaling: 0.1217 * 0.268 = 0.0326156.
            transform: &dragon_transform {translate: [0, 0.0326156, 0], rotate_deg: [0, 0, 0], scale: [0.268, 0.268, 0.268]}
            material: {color: [1, 0, 0.1], ambient: 0.1, diffuse: 0.6, specular: 0.3, shininess: 15, reflective: 0, transparency: 0, refractive_index: 1}
          - name: Red dragon bounds
            type: cube
            cast_shadow: false
            # Collapsed raw-bbox + bbox transforms, preserving their original order.
            transform: &bbox_transform {translate: [-0.0677906, 0.692646, 0.1196084], rotate_deg: [0, 0, 0], scale: [1.0005378, 0.692646, 0.4363844]}
            material: {color: [1, 1, 1], ambient: 0, diffuse: 0.4, specular: 0, shininess: 200, reflective: 0, transparency: 0.6, refractive_index: 1}
  - name: Right orange dragon display
    type: group
    transform: {translate: [2, 1, -1], rotate_deg: [0, 0, 0], scale: [1, 1, 1]}
    children:
      - *pedestal
      - name: Dragon and bounds
        type: group
        transform: {translate: [0, 0, 0], rotate_deg: [0, 229.1831181, 0], scale: [0.75, 0.75, 0.75]}
        children:
          - name: Orange dragon
            type: obj
            source: ../models/dragon.obj
            cast_shadow: true
            transform: *dragon_transform
            material: {color: [1, 0.5, 0.1], ambient: 0.1, diffuse: 0.6, specular: 0.3, shininess: 15, reflective: 0, transparency: 0, refractive_index: 1}
          - name: Orange dragon bounds
            type: cube
            cast_shadow: false
            transform: *bbox_transform
            material: &medium_bbox {color: [1, 1, 1], ambient: 0, diffuse: 0.2, specular: 0, shininess: 200, reflective: 0, transparency: 0.8, refractive_index: 1}
  - name: Left amber dragon display
    type: group
    transform: {translate: [-2, 0.75, -1], rotate_deg: [0, 0, 0], scale: [1, 1, 1]}
    children:
      - *pedestal
      - name: Dragon and bounds
        type: group
        transform: {translate: [0, 0, 0], rotate_deg: [0, -22.9183118, 0], scale: [0.75, 0.75, 0.75]}
        children:
          - name: Amber dragon
            type: obj
            source: ../models/dragon.obj
            cast_shadow: true
            transform: *dragon_transform
            material: {color: [0.9, 0.5, 0.1], ambient: 0.1, diffuse: 0.6, specular: 0.3, shininess: 15, reflective: 0, transparency: 0, refractive_index: 1}
          - name: Amber dragon bounds
            type: cube
            cast_shadow: false
            transform: *bbox_transform
            material: *medium_bbox
  - name: Far left yellow dragon display
    type: group
    transform: {translate: [-4, 0, -2], rotate_deg: [0, 0, 0], scale: [1, 1, 1]}
    children:
      - *pedestal
      - name: Dragon and bounds
        type: group
        transform: {translate: [0, 0, 0], rotate_deg: [0, -11.4591559, 0], scale: [0.5, 0.5, 0.5]}
        children:
          - name: Yellow dragon
            type: obj
            source: ../models/dragon.obj
            cast_shadow: true
            transform: *dragon_transform
            material: {color: [1, 0.9, 0.1], ambient: 0.1, diffuse: 0.6, specular: 0.3, shininess: 15, reflective: 0, transparency: 0, refractive_index: 1}
          - name: Yellow dragon bounds
            type: cube
            cast_shadow: false
            transform: *bbox_transform
            material: &small_bbox {color: [1, 1, 1], ambient: 0, diffuse: 0.1, specular: 0, shininess: 200, reflective: 0, transparency: 0.9, refractive_index: 1}
  - name: Far right lime dragon display
    type: group
    transform: {translate: [4, 0, -2], rotate_deg: [0, 0, 0], scale: [1, 1, 1]}
    children:
      - *pedestal
      - name: Dragon and bounds
        type: group
        transform: {translate: [0, 0, 0], rotate_deg: [0, 189.0760724, 0], scale: [0.5, 0.5, 0.5]}
        children:
          - name: Lime dragon
            type: obj
            source: ../models/dragon.obj
            cast_shadow: true
            transform: *dragon_transform
            material: {color: [0.9, 1, 0.1], ambient: 0.1, diffuse: 0.6, specular: 0.3, shininess: 15, reflective: 0, transparency: 0, refractive_index: 1}
          - name: Lime dragon bounds
            type: cube
            cast_shadow: false
            transform: *bbox_transform
            material: *small_bbox
  - name: Rear white dragon display
    type: group
    transform: {translate: [0, 0.5, -4], rotate_deg: [0, 0, 0], scale: [1, 1, 1]}
    children:
      - *pedestal
      - name: White dragon
        type: obj
        source: ../models/dragon.obj
        cast_shadow: true
        transform: {translate: [0, 0.0326156, 0], rotate_deg: [0, 179.9946913, 0], scale: [0.268, 0.268, 0.268]}
        material: {color: [1, 1, 1], ambient: 0.1, diffuse: 0.6, specular: 0.3, shininess: 15, reflective: 0, transparency: 0, refractive_index: 1}
