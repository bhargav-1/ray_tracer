# Editable triangle solids. Vertex coordinates are local to each group.
# A triangular pyramid has 3 lateral faces + a base; a square pyramid has 4 + a base.
# The requested 10-face solid is a decahedron, not a dodecahedron (12 faces).
# Square bases are triangulated into two faces. All solids are closed.
# Dodecahedron: 20 golden-ratio vertices; 12 pentagons split into 36 triangles.
version: 1
camera:
  from: [12, 10, -18]
  to: [1.6, 1, 0]
  up: [0, 1, 0]
  fov_deg: 45
  resolution: [960, 640]
lights:
  - position: [-6, 10, -8]
    color: [1, 1, 1]
  - position: [6, 7, 4]
    color: [0.35, 0.35, 0.4]
objects:
  - name: Floor
    type: plane
    cast_shadow: true
    transform: &identity {translate: [0, 0, 0], rotate_deg: [0, 0, 0], scale: [1, 1, 1]}
    material: {color: [0.3, 0.32, 0.36], ambient: 0.1, diffuse: 0.8, specular: 0.1, shininess: 100, reflective: 0, transparency: 0, refractive_index: 1}
  - name: Octahedron (8 faces)
    type: group
    transform: {translate: [-2.3, 0, -2.3], rotate_deg: [0, 0, 0], scale: [1, 1, 1]}
    children:
      - name: Face 1
        type: triangle
        vertices: [[0, 2.6, 0], [1.3, 1.3, 0], [0, 1.3, 1.3]]
        cast_shadow: true
        transform: *identity
        material: &material_0 {color: [0.15, 0.55, 0.9], ambient: 0.1, diffuse: 0.8, specular: 0.25, shininess: 80, reflective: 0, transparency: 0, refractive_index: 1}
      - name: Face 2
        type: triangle
        vertices: [[0, 0, 0], [0, 1.3, 1.3], [1.3, 1.3, 0]]
        cast_shadow: true
        transform: *identity
        material: *material_0
      - name: Face 3
        type: triangle
        vertices: [[0, 2.6, 0], [0, 1.3, 1.3], [-1.3, 1.3, 0]]
        cast_shadow: true
        transform: *identity
        material: *material_0
      - name: Face 4
        type: triangle
        vertices: [[0, 0, 0], [-1.3, 1.3, 0], [0, 1.3, 1.3]]
        cast_shadow: true
